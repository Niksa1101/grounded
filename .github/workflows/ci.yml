# Lint, type-check and test both apps on every PR and on main (Tech.md, CI section).
# The retrieval-eval job joins in Phase 2.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels the run it supersedes. Runs on main always finish, so every merge
# commit gets a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      db:
        # Same image as infra/docker-compose.yml, so CI and local behave alike.
        image: pgvector/pgvector:0.8.6-pg17-trixie
        env:
          POSTGRES_USER: grounded
          POSTGRES_PASSWORD: grounded
          POSTGRES_DB: grounded
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U grounded -d grounded"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://grounded:grounded@localhost:5433/grounded
      TEST_DATABASE_URL: postgresql://grounded:grounded@localhost:5433/grounded_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
