# Lint, type-check and test both apps on every PR and on main (Tech.md, CI section).
# Third-party actions are pinned to a commit SHA (the tag is in the comment), not to a movable tag.
# The retrieval-eval job joins in Phase 2.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels the run it supersedes. Runs on main always finish, so every merge
# commit gets a result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      db:
        # Same image as infra/docker-compose.yml, so CI and local behave alike.
        image: pgvector/pgvector:0.8.6-pg17-trixie
        env:
          POSTGRES_USER: grounded
          POSTGRES_PASSWORD: grounded
          POSTGRES_DB: grounded
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U grounded -d grounded"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://grounded:grounded@localhost:5433/grounded
      TEST_DATABASE_URL: postgresql://grounded:grounded@localhost:5433/grounded_test
      # tiktoken downloads its encoding file on first use; pytest blocks the network, so the file
      # is fetched (or restored) here before the tests run.
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.cache/tiktoken
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Pyright
        run: uv run pyright
      # Settings is the only source of the encoding, so the cache key and the warm-up follow it.
      - name: Read the tokenizer encoding
        id: tok
        run: |
          encoding=$(uv run python -c 'from grounded.settings import get_settings; print(get_settings().tokenizer_encoding)')
          echo "encoding=$encoding" >> "$GITHUB_OUTPUT"
      - name: Restore tiktoken cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TIKTOKEN_CACHE_DIR }}
          key: tiktoken-${{ steps.tok.outputs.encoding }}-v1
      - name: Warm tiktoken cache
        run: uv run python -c "import tiktoken; tiktoken.get_encoding('${{ steps.tok.outputs.encoding }}')"
      - name: Pytest
        run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
