name: probe-labels
on:
  pull_request:
    types: [labeled]
jobs:
  probe:
    if: github.event.label.name != 'question'
    concurrency:
      group: probe-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'label: ${{ github.event.label.name }}'
          sleep 70
