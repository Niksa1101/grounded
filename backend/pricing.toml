# List prices used for shadow cost (Tech.md §14, PRD D27). The demo itself runs on free tiers.
# Prices are copied from the provider pricing pages, never typed from memory. USD per 1M tokens.
# Free-tier prices are 0, so these are the PAID-tier list prices, i.e. "what this traffic would cost".
as_of = "2026-10-06"  # the day the pages were read; the pricing page itself says "Last updated 2026-10-01"
source = "https://ai.google.dev/gemini-api/docs/pricing, https://ai.google.dev/gemini-api/docs/deprecations"

# Gemini API, Standard tier. "Output price (including thinking tokens)": thinking tokens are billed as output.
# The page lists a later price that starts on 2027-01-01; the cost code picks the row by request date.
[models."gemini-3.6-flash"]
input_per_mtok = 0.75
output_per_mtok = 3.75
valid_until = "2026-12-31"

[models."gemini-3.6-flash".next]
valid_from = "2027-01-01"
input_per_mtok = 1.50
output_per_mtok = 7.50

# The model Grounded embeds with. The current pricing page lists only gemini-embedding-2 ($0.20 per 1M
# text tokens), a different model. The 0.15 below is the price Google announced when this model became
# generally available (developers.googleblog.com, 2025-07-14: "priced at $0.15 per 1M input tokens"),
# so it is a dated announcement, not a row of today's pricing page. Re-check it if the page lists it again.
[embeddings."gemini-embedding-001"]
input_per_mtok = 0.15
price_source = "https://developers.googleblog.com/gemini-embedding-available-gemini-api/"
price_as_of = "2025-07-14"  # date of the announcement; not confirmed on the pricing page on 2026-10-06
