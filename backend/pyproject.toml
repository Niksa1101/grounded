[project]
name = "grounded"
version = "0.1.0"
description = "Cited, schema-validated answers over the FastAPI docs, with an eval harness gated in CI."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.25.0",
    "markdown-it-py>=4.2.0",
    "pgvector>=0.5.0",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "tiktoken>=0.14.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
grounded = "grounded.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Fixture trees mimic other repos (e.g. the FastAPI docs examples); they are data, not our code.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "ASYNC",    # blocking calls inside async code
    "PT",       # pytest style
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
# The provider error names (ProviderRateLimited, ...) are part of the documented contract
# (Tech.md §9.1, AGENTS.md §9), so they keep their names without an "Error" suffix.
"src/grounded/infra/provider_errors.py" = ["N818"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["src", "tests"]
exclude = ["tests/fixtures", "**/__pycache__", "**/.*"]
# Strict on the package, basic on tests (Tech.md §2).
typeCheckingMode = "basic"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs the local pgvector database (docker compose or the CI service container)",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]
